<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Terug naar Assistent</title>
<script>
  // Na het inloggen bij de bank stuurt Enable Banking je hierheen (het moet een https-adres zijn).
  // Deze pagina stuurt alleen code, state en een eventuele foutcode door naar de Assistent op je eigen Mac.
  // Ze bewaart en verstuurt verder niets.
  (function () {
    var p = new URLSearchParams(location.search), q = new URLSearchParams();
    ['code', 'state', 'error'].forEach(function (k) { var v = p.get(k); if (v) q.set(k, v); });
    var doel = 'http://localhost:5190/koppelingen/bank/terug?' + q.toString();
    if (q.has('state')) location.replace(doel);
  })();
</script>
<style>
  :root { --tekst: #1d1d1f; --zacht: #6e6e73; --achter: #ffffff; --link: #0066cc; }
  @media (prefers-color-scheme: dark) {
    :root { --tekst: #f5f5f7; --zacht: #a1a1a6; --achter: #1c1c1e; --link: #4da3ff; }
  }
  body { margin: 0; background: var(--achter); color: var(--tekst);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.02em; }
  a { color: var(--link); }
  .klein { color: var(--zacht); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Terug naar Assistent</h1>
  <p>Je gaat door naar de Assistent op je Mac. Gebeurt er niets? Open dan <a href="http://localhost:5190/instellingen#bank">Instellingen › Bank</a> in de Assistent.</p>
  <p class="klein">Deze pagina hoort bij de bankkoppeling van Assistent. Zie de <a href="privacy.html">privacyverklaring</a>.</p>
</main>
</body>
</html>
